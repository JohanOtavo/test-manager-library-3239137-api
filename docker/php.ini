; El límite de 2 MB de la portada es una regla de negocio y la comprueba el
; caso de uso (CA-03.4). PHP se deja más holgado a propósito: si cortara él,
; el cliente recibiría un error del servidor en vez del 422 del contrato.
upload_max_filesize = 8M
post_max_size = 8M
memory_limit = 256M
date.timezone = UTC
